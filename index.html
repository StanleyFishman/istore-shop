<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
html { scroll-behavior: smooth; }
    body {font-family: Arial, sans-serif; margin: 0;}
    header {background: #333; color: #fff; padding: 10px 20px; position: fixed; top: 0; width: 100%;}
    header nav a {color: #fff; margin-right: 15px; text-decoration: none;}
    section {padding: 80px 20px; min-height: 100vh;}
    #home {background: #f5f5f5;}
    #about {background: #eaeaea;}
    #services {background: #f5f5f5;}
    #contact {background: #eaeaea;}
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home">
    <h1>Home Section</h1>
    <p>Welcome to our landing page.</p>
  </section>
  <section id="about">
    <h1>About Section</h1>
    <p>Information about us.</p>
  </section>
  <section id="services">
    <h1>Services Section</h1>
    <p>Details about our services.</p>
  </section>
  <section id="contact">
    <h1>Contact Section</h1>
    <p>Contact information goes here.</p>
  </section>
</body>
</html>
