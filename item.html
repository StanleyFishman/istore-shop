<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конфигуратор моделей</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Michroma&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/configurator.css" />
  </head>
  <body class="configurator-page">
    <header class="page-head">
      <div class="brand">
        <span class="brand-name">GIR ROS</span>
        <span class="brand-tagline">Industrial Engineering</span>
      </div>
      <button class="compare-indicator" type="button" aria-live="polite">
        Сравнить <span class="compare-count" id="compare-count">0</span>
      </button>
    </header>

    <main class="page-body">
      <div class="container">
        <h1 class="page-title">Конфигуратор</h1>
        <p class="page-subtitle">Подберите модель, которая лучше всего решит вашу задачу.</p>

        <div class="layout">
          <aside class="filters">
            <div class="filters-inner">
              <div class="filters-block">
                <div class="filters-header">
                  <h2>Модели</h2>
                  <span class="count-pill" data-count="model" hidden>0</span>
                </div>
                <ul class="filter-list" data-filter-group="model">
                  <li>
                    <label>
                      <input type="checkbox" name="model" value="base" />
                      Базовая
                    </label>
                  </li>
                  <li>
                    <label>
                      <input type="checkbox" name="model" value="pro" />
                      PRO
                    </label>
                  </li>
                  <li>
                    <label>
                      <input type="checkbox" name="model" value="ultra" />
                      Ultra
                    </label>
                  </li>
                </ul>
              </div>

              <section class="filter-group is-open" data-filter-group="material">
                <button class="group-toggle" type="button" aria-expanded="true">
                  <span class="label">Материал</span>
                  <span class="count-pill" data-count="material" hidden>0</span>
                  <span class="icon" aria-hidden="true">
                    <svg class="icon-plus" viewBox="0 0 24 24" focusable="false">
                      <path d="M12 5c.552 0 1 .448 1 1v5h5c.552 0 1 .448 1 1s-.448 1-1 1h-5v5c0 .552-.448 1-1 1s-1-.448-1-1v-5H6c-.552 0-1-.448-1-1s.448-1 1-1h5V6c0-.552.448-1 1-1Z" />
                    </svg>
                    <svg class="icon-minus" viewBox="0 0 24 24" focusable="false">
                      <path d="M6 11c-.552 0-1 .448-1 1s.448 1 1 1h12c.552 0 1-.448 1-1s-.448-1-1-1H6Z" />
                    </svg>
                  </span>
                </button>
                <div class="group-body">
                  <label><input type="checkbox" name="material" value="304L" /> AISI 304L</label>
                  <label><input type="checkbox" name="material" value="316L" /> AISI 316L</label>
                  <label><input type="checkbox" name="material" value="Ni" /> Ni-сплав</label>
                </div>
              </section>

              <section class="filter-group is-open" data-filter-group="power">
                <button class="group-toggle" type="button" aria-expanded="true">
                  <span class="label">Мощность</span>
                  <span class="count-pill" data-count="power" hidden>0</span>
                  <span class="icon" aria-hidden="true">
                    <svg class="icon-plus" viewBox="0 0 24 24" focusable="false">
                      <path d="M12 5c.552 0 1 .448 1 1v5h5c.552 0 1 .448 1 1s-.448 1-1 1h-5v5c0 .552-.448 1-1 1s-1-.448-1-1v-5H6c-.552 0-1-.448-1-1s.448-1 1-1h5V6c0-.552.448-1 1-1Z" />
                    </svg>
                    <svg class="icon-minus" viewBox="0 0 24 24" focusable="false">
                      <path d="M6 11c-.552 0-1 .448-1 1s.448 1 1 1h12c.552 0 1-.448 1-1s-.448-1-1-1H6Z" />
                    </svg>
                  </span>
                </button>
                <div class="group-body">
                  <label><input type="checkbox" name="power" value="5.5" /> 5.5 кВт</label>
                  <label><input type="checkbox" name="power" value="7.5" /> 7.5 кВт</label>
                  <label><input type="checkbox" name="power" value="9.0" /> 9.0 кВт</label>
                </div>
              </section>

              <section class="filter-group is-open" data-filter-group="throughput">
                <button class="group-toggle" type="button" aria-expanded="true">
                  <span class="label">Производительность</span>
                  <span class="count-pill" data-count="throughput" hidden>0</span>
                  <span class="icon" aria-hidden="true">
                    <svg class="icon-plus" viewBox="0 0 24 24" focusable="false">
                      <path d="M12 5c.552 0 1 .448 1 1v5h5c.552 0 1 .448 1 1s-.448 1-1 1h-5v5c0 .552-.448 1-1 1s-1-.448-1-1v-5H6c-.552 0-1-.448-1-1s.448-1 1-1h5V6c0-.552.448-1 1-1Z" />
                    </svg>
                    <svg class="icon-minus" viewBox="0 0 24 24" focusable="false">
                      <path d="M6 11c-.552 0-1 .448-1 1s.448 1 1 1h12c.552 0 1-.448 1-1s-.448-1-1-1H6Z" />
                    </svg>
                  </span>
                </button>
                <div class="group-body">
                  <label><input type="checkbox" name="throughput" value="250" /> 250 кг/ч</label>
                  <label><input type="checkbox" name="throughput" value="300" /> 300 кг/ч</label>
                  <label><input type="checkbox" name="throughput" value="400" /> 400 кг/ч</label>
                </div>
              </section>

              <section class="filter-group is-collapsed" data-filter-group="automation">
                <button class="group-toggle" type="button" aria-expanded="false">
                  <span class="label">Автоматика</span>
                  <span class="count-pill" data-count="automation" hidden>0</span>
                  <span class="icon" aria-hidden="true">
                    <svg class="icon-plus" viewBox="0 0 24 24" focusable="false">
                      <path d="M12 5c.552 0 1 .448 1 1v5h5c.552 0 1 .448 1 1s-.448 1-1 1h-5v5c0 .552-.448 1-1 1s-1-.448-1-1v-5H6c-.552 0-1-.448-1-1s.448-1 1-1h5V6c0-.552.448-1 1-1Z" />
                    </svg>
                    <svg class="icon-minus" viewBox="0 0 24 24" focusable="false">
                      <path d="M6 11c-.552 0-1 .448-1 1s.448 1 1 1h12c.552 0 1-.448 1-1s-.448-1-1-1H6Z" />
                    </svg>
                  </span>
                </button>
                <div class="group-body">
                  <label><input type="checkbox" name="automation" value="basic" /> Базовая</label>
                  <label><input type="checkbox" name="automation" value="smart" /> Smart</label>
                </div>
              </section>
            </div>
            <button class="reset" type="button">Сбросить фильтры</button>
          </aside>

          <section class="cards-area">
            <div class="cards-head">
              <span class="results">Найдено: <span id="results-count">0</span></span>
            </div>
            <section class="cards" id="cards" aria-live="polite"></section>
            <div class="empty-state" id="empty-state" hidden>
              По выбранным параметрам ничего не найдено. Попробуйте изменить фильтры.
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="assets/configurator.js"></script>
  </body>
</html>
